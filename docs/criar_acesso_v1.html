<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATOS — Criar Acesso (novo layout)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #060608;
    color: #e4e4e7;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .neon-1 { position: absolute; top: -120px; left: 10%; width: 420px; height: 420px; background: radial-gradient(circle, #4d94ff35 0%, transparent 70%); filter: blur(50px); pointer-events: none; }
  .neon-2 { position: absolute; bottom: -120px; right: 12%; width: 420px; height: 420px; background: radial-gradient(circle, #8c5aff30 0%, transparent 70%); filter: blur(50px); pointer-events: none; }

  .card {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px;
    padding: 40px 36px;
    z-index: 1;
    box-shadow: 0 0 60px rgba(77,148,255,0.08);
  }
  .logo { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 4px; }
  .logo .dot { color: #6db2ff; text-shadow: 0 0 16px #4d94ff; }
  .subtitle { font-size: 13px; color: #9aa8d8; text-align: center; margin-bottom: 24px; }

  .group-chip { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12.5px; color: #8ec2ff; background: rgba(77,148,255,0.08); border: 1px solid rgba(77,148,255,0.25); border-radius: 10px; padding: 10px 16px; margin-bottom: 28px; }
  .group-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #4d94ff; box-shadow: 0 0 6px #4d94ff; }
  .group-chip b { color: #fff; }

  .field-label { font-size: 12px; color: #a8b0d8; margin-bottom: 6px; display: block; font-weight: 600; }
  .field-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 13.5px; margin-bottom: 18px; font-family: inherit; outline: none; }
  .field-input:focus { border-color: rgba(77,148,255,0.5); box-shadow: 0 0 0 3px rgba(77,148,255,0.1); }

  .btn-cadastrar { width: 100%; background: linear-gradient(135deg, #4d94ff, #8c5aff); border: none; border-radius: 10px; padding: 14px; color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 4px 20px rgba(77,148,255,0.3); cursor: pointer; }
</style>
</head>
<body>
  <div class="neon-1"></div><div class="neon-2"></div>

  <div class="card">
    <div class="logo">atos<span class="dot">.</span></div>
    <div class="subtitle">Crie seu login e senha</div>

    <div class="group-chip"><span class="dot"></span>Cadastro para o grupo: <b>BRAVA</b></div>

    <label class="field-label">Login</label>
    <input class="field-input" type="text" placeholder="Escolha seu login" />

    <label class="field-label">Senha</label>
    <input class="field-input" type="password" placeholder="Crie uma senha segura" />

    <button class="btn-cadastrar">Cadastrar</button>
  </div>
</body>
</html>
